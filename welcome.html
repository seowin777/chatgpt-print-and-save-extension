<meta charset="utf-8">

<title>ChatGPT Print and Save is installed</title>

<script async src="https://www.googletagmanager.com/gtag/js?id={{GA_ID}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{GA_ID}}');
  gtag('event', 'install', {extension: 'chatgpt-print-and-save-extension', source: new URLSearchParams(location.search).get('v') || ''});
</script>
<style>
  :root {
    --bg: #F6F7F9; --card: #FFFFFF; --fg: #1A1B1E; --muted: #6B6F76; --line: #E4E5E8; --sunk: #EEF0F3;
    --accent: #4F46E5; --ok: #16A34A; --shadow: 0 2px 12px rgba(20, 37, 71, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --card: #1F2023; --fg: #ECECEF; --muted: #9A9EA6; --line: #34363B; --sunk: #2A2C31;
      --accent: #818CF8; --ok: #4ADE80; --shadow: 0 2px 12px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: var(--shadow); }
  h1 { font-size: 28px; margin: 16px 0 32px; }
  h1 .tick { color: var(--ok); }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin: 0 0 20px; }
  .card h2 { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; margin: 0 0 12px; }
  .n { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 16px; }
  .card svg { display: block; width: 100%; height: auto; }

  /* drawings: colours come from the page theme */
  .s-win { fill: var(--card); stroke: var(--line); }
  .s-bar { fill: var(--sunk); }
  .s-dot { fill: var(--line); }
  .s-url { fill: var(--card); }
  .s-t { fill: var(--muted); font: 14px system-ui, sans-serif; }
  .s-tb { fill: var(--fg); font: 600 14px system-ui, sans-serif; }
  .s-ts { fill: var(--muted); font: 12px system-ui, sans-serif; }
  .s-menu { fill: var(--card); stroke: var(--line); filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .15)); }
  .s-hl { fill: var(--accent); opacity: .12; }
  .s-ico { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .s-wico { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .s-line { fill: var(--sunk); }
  .s-main { fill: var(--accent); }
  .s-mt { fill: #fff; font: 600 14px system-ui, sans-serif; }
  .s-tile { fill: none; stroke: var(--line); }
  .s-arrow { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .s-ring { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: pulse 1.5s ease-in-out infinite; }
  .s-badge { fill: var(--accent); }
  .s-bt { fill: #fff; font: 700 13px system-ui, sans-serif; text-anchor: middle; }
  .s-ok { fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .s-ring, .look svg { animation: none; } }

  .cta {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 32px; min-height: 56px; font-size: 18px;
    border-radius: 999px; color: #fff; font-weight: 600; text-decoration: none;
    background: linear-gradient(135deg, #4F46E5, #9333EA); box-shadow: 0 4px 14px rgba(79, 70, 229, .4); transition: transform 150ms;
  }
  .cta:hover { transform: translateY(-1px); }
  .cta:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* points at the real Chrome toolbar above the page */
  .look { position: fixed; top: 4px; right: 84px; display: flex; align-items: flex-start; gap: 6px; color: var(--accent); font-weight: 700; pointer-events: none; }
  .look svg { width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; animation: nudge 1.2s ease-in-out infinite; }
  .look span { margin-top: 40px; }
  @keyframes nudge { 50% { transform: translate(4px, -4px); } }
  @media (max-width: 900px) { .look { display: none; } }
</style>
</head>
